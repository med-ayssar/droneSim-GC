# NATS Server Configuration for PX4 Drone Control Platform

# Standard Client Port
port: 4222

# HTTP Monitoring Port
http_port: 8222

# WebSocket Port for Browser Frontend
websocket {
  port: 9222
  no_tls: true
  same_origin: false
}

# Authentication & Authorization Rules
authorization {
  users: [
    {
      user: "operator",
      password: "operator_password",
      permissions: {
        publish: ["drone.*.command"]
        subscribe: [
          "drone.*.telemetry",
          "drone.*.command.result",
          "drone.*.event",
          "drone.*.status"
        ]
      }
    },
    {
      user: "bridge",
      password: "bridge_password",
      permissions: {
        subscribe: ["drone.*.command"]
        publish: [
          "drone.*.telemetry",
          "drone.*.command.result",
          "drone.*.event",
          "drone.*.status"
        ]
      }
    },
    {
      user: "admin",
      password: "admin_password",
      permissions: {
        publish: [">"]
        subscribe: [">"]
      }
    }
  ]
}
