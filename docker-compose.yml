services:
  nats:
    build:
      context: ./services/nats
    container_name: drone-nats
    ports:
      - "4222:4222"
      - "9222:9222"
      - "8222:8222"
    networks:
      - drone_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: drone-frontend
    ports:
      - "3000:3000"
    depends_on:
      - nats
    networks:
      - drone_network
    restart: unless-stopped

  px4-ros2:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final
    container_name: px4-ros2
    depends_on:
      - nats
    privileged: true
    tty: true
    stdin_open: true
    ports:
      - "2222:22"
      - "8443:8443"
      - "14550:14550/udp"
      - "14540:14540/udp"
      - "14560:14560/udp"
      - "8888:8888/udp"
      - "7400:7400/udp"
      - "7401:7401/udp"
    environment:
      - DISPLAY=:1
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - PX4_SIM_HOST_ADDR=127.0.0.1
      - NATS_HOST=nats
      - NATS_PORT=4222
      - DRONE_ID=drone01
    volumes:
      - type: bind
        source: /tmp/.X11-unix/X0
        target: /tmp/wsl-X0
      - /mnt/wslg:/mnt/wslg:rw
      - ./packages:/home/drone/packages
      - ./protobuf:/home/drone/protobuf
    networks:
      - drone_network
    command: bash

networks:
  drone_network:
    driver: bridge
